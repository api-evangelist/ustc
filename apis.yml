aid: ustc
name: University of Science and Technology of China
description: >-
  The University of Science and Technology of China (USTC, 中国科学技术大学) is a public research
  university in Hefei, Anhui, founded in 1958 under the Chinese Academy of Sciences, a member of
  the C9 League and ranked #63 in the QS World University Rankings 2025. USTC publishes no
  developer portal, no open-data platform and no institutional API program — but it is not the
  empty profile an earlier pass recorded. Its Network Information Center runs and DOCUMENTS a
  genuine identity platform: a first-party CAS 3.0 / OAuth 2.0 / OpenID Connect authorization
  server at id.ustc.edu.cn with an anonymously readable discovery document and JWKS, a developer
  manual with parameter tables and worked examples at id.ustc.edu.cn/doc/developer/, an
  enrollment-status query API with a published error table and a public health check, and a
  self-hosted Shibboleth 5.2.2 identity provider at idp.ustc.edu.cn whose SAML 2.0 metadata is
  the strongest machine-readable contract in this profile — federating into CARSI, the CAS
  Science Cloud AAI and eduGAIN. Beyond identity, USTC operates a course catalog with a live
  JSON API at catalog.ustc.edu.cn (401 to the public, and self-declaring restricted mode), the
  USTC Open Source Software Mirror on the university's own APNIC allocation, a campus GitLab,
  a supercomputing centre, and its own DeepSeek-based AI assistant with a published user
  agreement. Every one of those surfaces is institution-operated; almost every one is gated to
  campus members, and USTC states plainly that applications outside the ustc.edu.cn domain are
  not supported. No vendor contract is attributed to USTC in this profile — no Figshare, Pure,
  Ex Libris, Dataverse or Canvas surface was found under its name.
