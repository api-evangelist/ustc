- aid: ustc:campus-status
  name: USTC Campus Enrollment Status Query API (在校状态查询接口)
  description: >-
    A small, precise, institution-authored REST API that resolves a person's campus enrollment
    status code by global person identifier or identity number, singly or in batches of up to
    100. USTC publishes it in prose with a field table, response examples, curl invocations and
    an enumerated error table that distinguishes a missing token (401) from a valid token off
    the IP allowlist (403). It requires both an administrator-issued bearer token and a
    registered source IP, and USTC says outright that it is not for browser users. The health
    check is public and returns 200. An OpenAPI 3.1 description is DERIVED here from USTC's own
    documentation; USTC publishes no machine-readable contract itself.
  humanURL: https://id.ustc.edu.cn/doc/status-api/
