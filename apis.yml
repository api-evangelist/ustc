- aid: ustc:mirrors
  name: USTC Open Source Software Mirror
  description: >-
    The USTC Open Source Software Mirror, operated by the campus Linux User Group (LUG @ USTC),
    is one of the largest open source mirror services among universities in mainland China,
    carrying Debian, Ubuntu, Fedora, Arch Linux, CentOS and hundreds of other repositories. It is
    consumed over package-manager protocols — HTTP, HTTPS and rsync — rather than a REST API,
    with a configuration help site and a server-rendered sync status page. No JSON API is
    exposed: /api/, /jobs/, /mirrorz.json and the .mirrorz path all refuse or 404. The
    surrounding tooling is genuinely USTC's own engineering and is open source, including Yuki,
    the in-house mirror management daemon, and an rsync reverse proxy.
  humanURL: https://mirrors.ustc.edu.cn/help/
  baseURL: https://mirrors.ustc.edu.cn/
