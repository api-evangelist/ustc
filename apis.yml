- aid: ustc:idp
  name: USTC Shibboleth Identity Provider (跨校资源认证中心)
  description: >-
    USTC's self-hosted Shibboleth IdP 5.2.2, publishing a 15KB SAML 2.0 EntityDescriptor for
    entityID https://idp.ustc.edu.cn/idp/shibboleth with a shibmd:Scope of ustc.edu.cn, SSO and
    SLO endpoints across Redirect, POST and POST-SimpleSign bindings, SOAP artifact resolution
    and attribute query on port 8443, and twelve certificates. It federates into CARSI, the
    Chinese Academy of Sciences CSTCloud AAI and eduGAIN, which is how USTC members reach
    licensed library databases from off campus without a VPN. Institution-operated by definition
    and confirmed by address ownership — this is not a managed federation platform wearing a
    university hostname. Anonymously readable; the metadata is archived in this repository.
  humanURL: http://ustcnet.ustc.edu.cn/2022/1221/c33557a592151/page.htm
