apis:
- aid: ustc:passport
  name: USTC Unified Identity Authentication (id.ustc.edu.cn, formerly Passport SSO)
  description: >-
    USTC's institution-operated authorization server, run by the Network Information Center and
    the hub every other campus system authenticates against. It speaks CAS 3.0, OAuth 2.0
    authorization code (recommended for new integrations) and OpenID Connect 1.0, and publishes
    an anonymously readable discovery document and JWKS. USTC also publishes a real developer
    manual for it — endpoint tables, parameter tables, an 8-hour token lifetime, a CSRF warning
    directing integrators to verify `state`, and mobile SDKs for Android, iOS and HarmonyOS.
    Access is administrator-granted: a client_id exists only after a registration and filing
    process, and USTC states explicitly that applications not deployed on campus and not on a
    ustc.edu.cn domain are not supported. passport.ustc.edu.cn is the legacy hostname, kept for
    redirects since the February 2025 cutover and resolving to the same address; it still answers
    CAS validation and the health check but 404s the OIDC discovery path.
  humanURL: https://id.ustc.edu.cn/doc/
  baseURL: https://id.ustc.edu.cn/cas
