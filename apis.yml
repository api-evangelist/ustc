- aid: ustc:catalog
  name: USTC Course Catalog API (catalog.ustc.edu.cn)
  description: >-
    The JSON API behind USTC's public course catalog application — semesters, the college tree,
    program trees, course search, course and lesson detail, exam lists, major lists and public
    timetables, across eighteen routes under /api/teach/. It is institution-operated and live,
    but every data route answers 401 to an unauthenticated caller, and the application's own
    /api/restricted route returns {"restricted":true}, so the catalog is in a declared restricted
    mode rather than merely unauthenticated. Recorded because a registrar/timetable API is one of
    the few surface classes a university genuinely runs itself, and because this one is real,
    routed and USTC's own — not a student project on an outside domain.
  humanURL: https://catalog.ustc.edu.cn/
