x-coverage:
  state: gated
  reason: auth_required
  detail: >-
    USTC operates real, institution-owned API surfaces and documents some of them well, but an
    unaffiliated caller cannot consume any of them. The unified identity authorization server at
    id.ustc.edu.cn publishes an anonymously readable OIDC discovery document and JWKS, yet a
    client_id exists only after a manual registration and filing process, and USTC states
    explicitly that applications not deployed on campus and not on a ustc.edu.cn domain are not
    supported at all — the clearest such statement found in this cohort. The enrollment status
    API returns 200 on its public health check and 401 on every business path, and requires both
    an administrator-issued bearer token and a registered source IP. The course catalog's
    eighteen /api/teach/ routes answer 401 and the application declares itself restricted at
    /api/restricted. The library OPAC returns 200 with a prose refusal naming the caller's
    off-campus IP address. The one fully public machine-readable contract is the SAML 2.0
    metadata of the Shibboleth IdP at idp.ustc.edu.cn, which is why it is the centrepiece of this
    profile.

    This is a re-profile, and it moves in the opposite direction to the rest of this cohort. The
    June 2026 pass recorded two surfaces and no artifacts and concluded USTC had no documented
    API program; probing found a documented one that was simply never looked for. Nothing was
    removed for vendor misattribution because nothing vendor-attributed was ever here — no
    Figshare, Pure, Ex Libris, Dataverse or Canvas contract. The single vendor-product API found
    (GitLab at git.ustc.edu.cn) is recorded as a deployment with x-contract-operator: vendor and
    no specification saved.

    Not found, after probing: any OAI-PMH endpoint (lib.ustc.edu.cn/oai 404s, ir.lib.ustc.edu.cn
    does not resolve), any institutional repository under USTC's own domain, any open-data
    portal (data.ustc.edu.cn does not resolve), any llms.txt, and any /.well-known catalog other
    than the OIDC discovery document. USTC's own AI assistant is real and institution-operated —
    the Network Information Center runs it on DeepSeek — and its user agreement mentions API
    delivery, but no API documentation for it is published, so it is recorded as a pointer rather
    than a surface.
